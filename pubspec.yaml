name: fqapp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.131+136

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # 中文 Material 文案（复制/粘贴/全选等系统文本菜单）：没有 delegates 时
  # Flutter 一律回退英文，即使系统语言是中文（issue #79）。
  flutter_localizations:
    sdk: flutter
  material_ui:
    path: packages/material_ui
  cupertino_ui:
    path: packages/cupertino_ui

  http: ^1.6.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  # hive_ce is the maintained Hive fork; all boxes open encrypted via
  # EncryptedHive (P1-3). Keys live in flutter_secure_storage (Keystore).
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  # 鸿蒙适配：参照 PiliNara/tsukuyomi-space-app 的做法，用本地 path 覆盖
  # flutter_secure_storage（官方 9.2.4 父包未声明 ohos 平台），本地包只做
  # re-export flutter_secure_storage_ohos；ohos 实现取 hosted 1.0.0 版。
  flutter_secure_storage:
    path: packages/flutter_secure_storage
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  flutter_riverpod: ^3.4.3
  archive: ^4.3.0
  html: 0.15.6
  xml: ^7.0.1
  flutter_lucide: ^1.58.0
  lottie: ^3.6.1
  flutter_rust_bridge: 2.13.0
  #鸿蒙适配
  flutter_rust_bridge_ohos: ^2.11.2
  connectivity_plus: ^7.3.1
  # 鸿蒙适配：与 host 版 connectivity_plus 走同一 MethodChannel
  # （dev.fluttercommunity.plus/connectivity），该包只做原生注册，Dart 侧为空。
  connectivity_plus_ohos:
    git:
      url: https://github.com/HelloZeroNick/connectivity_plus_ohos.git
      ref: main
  flutter_localization:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_localization.git
      ref: br_3.41_dev
  image: ^4.12.0
  flutter_svg: ^2.3.0
  # 鸿蒙播放后端：media_kit 是纯 Dart + dart:ffi 的 libmpv 封装（pubspec 里没有
  # flutter.plugin 声明，所以加进来不会给 Android 带进 Gradle 子模块）。官方
  # pub 版本（1.2.6）的 lib/ 下没有任何 ohos 分支，必须取 fork 的 pinned 提交；
  # 8babdf4f 是媒体组核对过的远端分支头，含 player.dart / media_kit.dart 的
  # `operatingSystem == 'ohos'` 分派与 native_library 的 libmpv.so 候选名。
  media_kit:
    git:
      url: https://github.com/HelloZeroNick/media-kit.git
      path: media_kit
      ref: 8babdf4f456142fc8027f475838c5006da4656dd
  # lib/services/desktop_platform.dart 无条件 import 了下面这几个 Windows 桌面端
  # 才用到的包；它们的具体实现全部在 `isWindowsDesktop` 之后才调用，鸿蒙侧
  # 只需要能被解析（pub get）与编译（build hap）。media_kit_video 与 media_kit
  # 取同一个 fork/提交，以便鸿蒙上仍有 ohos 分派。
  media_kit_video:
    git:
      url: https://github.com/HelloZeroNick/media-kit.git
      path: media_kit_video
      ref: 8babdf4f456142fc8027f475838c5006da4656dd
  screen_retriever: ^0.2.2
  window_manager: ^0.5.1
  file_selector:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/file_selector/file_selector
      ref: br_file_selector-v1.1.0_ohos_dev
  # Windows 专用 libmpv；不要把 umbrella 的 media_kit_libs_video 加回来，否则
  # Android/iOS/macOS/Linux 的播放库会一起进包（APK 多出 ~11 MB）。
  media_kit_libs_windows_video: 1.0.11
  flutter_tts: ^4.2.5
  webview_windows:
    path: third_party/webview_windows
  smtc_windows: ^1.1.0
  ffi: ^2.1.4

# 鸿蒙（OHOS）适配：以下包在 pub 上没有携带 ohos 平台的版本，改指到
# OpenHarmony 社区维护的 fork。overrides 会绕过版本约束，因此 fork 版本号
# 低于 pubspec.lock 中已解析的版本属预期现象，差异见本轮报告。
dependency_overrides:
  # 强制第三方包里的 material_ui/cupertino_ui 也走本地 shim
  material_ui:
    path: packages/material_ui
  cupertino_ui:
    path: packages/cupertino_ui
  # 应用可用路径。取 pinned 分支而非 PiliNara 的 ref HEAD，避免上游漂移。
  media_kit_video:
    git:
      url: https://github.com/HelloZeroNick/media-kit.git
      path: media_kit_video
      ref: 8babdf4f456142fc8027f475838c5006da4656dd
  # fork 里的 media_kit_video 自己声明依赖 hosted 的 media_kit，与本项目 git 版
  # media_kit 冲突（pub：两个来源同一个包 -> forbidden）。统一 override 到同一提交。
  media_kit:
    git:
      url: https://github.com/HelloZeroNick/media-kit.git
      path: media_kit
      ref: 8babdf4f456142fc8027f475838c5006da4656dd
  path_provider:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  # 键值存储。与 PiliNara 同一分支。
  shared_preferences:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  # 打开链接。与 PiliNara 同一 fork。
  url_launcher:
    git:
      url: https://gitcode.com/hellozeronick/url_launcher.git
      path: url_launcher
      ref: main
  # 数据库。PiliNara 未适配 sqflite（它不用 flutter_cache_manager），
  # 但本项目的 cached_network_image -> flutter_cache_manager 依赖 sqflite，
  # 海报/网络图缓存路径在鸿蒙上需要它。
  sqflite:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_sqflite.git
      path: sqflite
      ref: br_v2.4.2_ohos
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1
  # 弹幕调度器用假时钟覆盖重试与生命周期时序（test/playlet_danmaku_loader_test.dart）。
  fake_async: ^1.3.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/config/config.json
    - assets/config/filter.json
    - assets/config/device_pool.example.json
    - assets/filters/
    - assets/plugins/
    - assets/images/app_logo.webp
    - assets/images/bubble/
    # 短剧单列卡右侧栏/信息层的官方图标，从
    # `ckao/decompile/apktool/res/drawable*/` 原样抽出（见
    # docs/research/short-drama-decompile-comparison-20260921.md §8）。
    - assets/images/drama/
    # 「上滑查看更多视频」的官方箭头动画（`more_wonderful_series_up_arrow.json`），
    # 原样复制、仅把填充色改为白色——官方运行时用 LottieValueCallback 强制
    # `@color/al`=#ffffffff（见同文档 §19）。
    - assets/lottie/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
