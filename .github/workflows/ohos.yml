name: Build HarmonyOS (ohos)
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ohos-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_OHOS_VERSION: '3.44.9'
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter for OpenHarmony
        run: |
          # Full clone (no --depth 1): the ohos flutter derives its version via
          # `git describe --tags`; a shallow clone yields 0.0.0-unknown and a
          # tags-only fetch can't describe the branch head, breaking pub get.
          git clone -b oh-3.44.9-dev https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter doctor
      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: '26.0.0.821'
          cache: true
      - name: Get Flutter dependencies
        # Skip LFS smudge: gitcode LFS requires auth (same as PiliNara CI).
        run: flutter pub get
        env:
          GIT_LFS_SKIP_SMUDGE: 1
      - name: Build HAP
        # Release, not debug: the artifact is published for users, so it must be
        # an AOT build without the debug runtime's JIT/assert overhead. CI holds
        # no signing material, so Hvigor's signing step can still fail after the
        # unsigned package is written; failure here is not a verdict -- the
        # collect step below decides whether a usable release HAP exists and
        # fails loudly when it does not.
        continue-on-error: true
        run: |
          flutter build hap --release --target-platform ohos-arm64

      - name: Collect unsigned HAP
        run: |
          # Hvigor names the product `entry-default-unsigned.hap`. Publishing
          # that name verbatim gives a downloader no version and no target ABI,
          # and the `-default-` token reads like a debug fallback rather than a
          # release-named package. Copy it under an explicit release name, and
          # skip the `-signed` sibling entirely: CI has no signing material, so
          # that file is a leftover of the failing Hvigor signing step, not a
          # proven signature. The artifact keeps the .hap suffix either way --
          # upload-artifact stores the file name as-is, so renaming to e.g.
          # `.zip` would destroy the only thing an installer can open.
          mkdir -p dist
          # Tag builds carry the version; branch/dispatch builds fall back to
          # the pubspec version so the name is never empty.
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          fi
          hap="$(find ohos/entry/build/default/outputs/default -maxdepth 1 -name '*.hap' ! -name '*-signed.hap' | head -n1)"
          if [[ -z "$hap" ]]; then
            echo '::error::flutter build hap --release did not produce an unsigned .hap' >&2
            find ohos/entry/build -name '*.hap' >&2 || true
            exit 1
          fi
          # The build step is allowed to fail on signing, so it cannot vouch for
          # the mode. Assert it here instead: a debug HAP still loads and still
          # installs, which is exactly how a JIT package would slip into a
          # release unnoticed. With --release the engine ships libapp.so (AOT);
          # a debug build does not, so an empty or absent payload is the tell.
          payloads="$(unzip -l "$hap" | grep -c 'libs/.*/libapp\.so')"
          if [[ "${payloads:-0}" -eq 0 ]]; then
            echo '::error::The collected HAP has no libapp.so AOT payload; it is not a release build' >&2
            unzip -l "$hap" | head -40 >&2 || true
            exit 1
          fi
          target="dist/fqapp-${version}-ohos-arm64-unsigned.hap"
          install -m 0644 "$hap" "$target"
          printf 'hap_source=%s\nhap_name=%s\nhap_aot_payloads=%s\n' \
            "$hap" "$(basename "$target")" "$payloads"
          ls -la dist/
          case "$target" in *.hap) ;; *) echo '::error::release artifact must end in .hap' >&2; exit 1;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: fqapp-ohos-hap
          path: dist/*.hap
          if-no-files-found: error
          retention-days: 14
